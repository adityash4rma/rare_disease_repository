version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Frontend Web App (React + TypeScript + Vite + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: rare_disease_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-backend
    networks:
      - rare-disease-net

  # -------------------------------------------------------------
  # 2. Central API Backend (FastAPI + SQLite/PostgreSQL)
  # -------------------------------------------------------------
  api-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rare_disease_backend
    restart: unless-stopped
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - sqlite_data:/app/data
    environment:
      - APP_NAME=Rare Disease Repository API
      - APP_VERSION=1.0.0
      - DEBUG=True
      - DATABASE_URL=sqlite+aiosqlite:///./rare_disease.db
      - JWT_SECRET_KEY=rare-disease-production-secret-key-change-me
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
    networks:
      - rare-disease-net

  # -------------------------------------------------------------
  # 3. Federated Learning Central Aggregator Server (Flower FL)
  # -------------------------------------------------------------
  fl-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fl_central_server
    restart: unless-stopped
    command: python federated_learning/server.py
    ports:
      - "8090:8090"
    volumes:
      - .:/app
    networks:
      - rare-disease-net

  # -------------------------------------------------------------
  # 4. Federated Learning Hospital Node A
  # -------------------------------------------------------------
  hospital-node-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital_node_a
    restart: on-failure
    command: python federated_learning/local_hospital_node.py --node-id A --server-address fl-server:8090
    environment:
      - SERVER_ADDRESS=fl-server:8090
    volumes:
      - .:/app
    depends_on:
      - fl-server
    networks:
      - rare-disease-net

  # -------------------------------------------------------------
  # 5. Federated Learning Hospital Node B
  # -------------------------------------------------------------
  hospital-node-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital_node_b
    restart: on-failure
    command: python federated_learning/local_hospital_node.py --node-id B --server-address fl-server:8090
    environment:
      - SERVER_ADDRESS=fl-server:8090
    volumes:
      - .:/app
    depends_on:
      - fl-server
    networks:
      - rare-disease-net

  # -------------------------------------------------------------
  # 6. Federated Learning Hospital Node C
  # -------------------------------------------------------------
  hospital-node-c:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital_node_c
    restart: on-failure
    command: python federated_learning/local_hospital_node.py --node-id C --server-address fl-server:8090
    environment:
      - SERVER_ADDRESS=fl-server:8090
    volumes:
      - .:/app
    depends_on:
      - fl-server
    networks:
      - rare-disease-net

networks:
  rare-disease-net:
    driver: bridge

volumes:
  sqlite_data:
