services:
  # ==============================================================================
  # 1. FastAPI REST API Backend
  # ==============================================================================
  - type: web
    name: rare-disease-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu && python -m backend.seed_indian_dataset"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: .
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000"
      - key: JWT_SECRET_KEY
        generateValue: true

  # ==============================================================================
  # 2. React + Vite Frontend (Static SPA Site)
  # ==============================================================================
  - type: web
    name: rare-disease-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rare-disease-api
          property: host
