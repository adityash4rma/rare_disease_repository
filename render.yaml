services:
  # ==============================================================================
  # 1. FastAPI REST API Backend (Docker Runtime)
  # ==============================================================================
  - type: web
    name: rare-disease-api
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET_KEY
        generateValue: true

  # ==============================================================================
  # 2. React + Vite Frontend (Static SPA Site)
  # ==============================================================================
  - type: web
    name: rare-disease-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && VITE_API_URL=https://rare-disease-api.onrender.com npm run build"
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://rare-disease-api.onrender.com
